<script>
window.__bootMap = function () {
const D = window.VELO_DATA;
const TRACKS = D.tracks, ROUTES = D.routes, ORPHANS = D.orphans;
const MINE = D.mine || [];   // the athlete's own rides, a backdrop layer
const trackById = new Map(TRACKS.map(t => [t.id, t]));
/* ---------- polyline codec ---------- */
function decodePolyline(str) {
  let index = 0, lat = 0, lng = 0;
  const out = [];
  while (index < str.length) {
    let shift = 0, result = 0, b;
    do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lat += (result & 1) ? ~(result >> 1) : (result >> 1);
    shift = 0; result = 0;
    do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lng += (result & 1) ? ~(result >> 1) : (result >> 1);
    out.push([lat / 1e5, lng / 1e5]);
  }
  return out;
}
function latlngs(track, lod) {
  const key = lod === 'lo' ? '_lo' : '_hi';
  if (!track[key]) track[key] = decodePolyline(lod === 'lo' ? (track.polylo || track.poly) : track.poly);
  return track[key];
}
/* ---------- colors ---------- */
const PALETTE = ['#e8522b','#2b7fe8','#1fa363','#b455d6','#e0a800','#0fb4c4','#d6336c','#7a5cf0',
                 '#5c8a2b','#c2571d','#3d6bb3','#8c8c00','#00897b','#6d4c41','#546e7a'];
// side names come from the sheet as they are written there
const ORDER = ['Центр','Север','Северо-Восток','Восток','Юго-Восток','Юг','Юго-Запад','Запад','Северо-Запад'];
const CANON = ORDER.concat(ORDER.map(s => 'Дальний ' + s));
const routeSides = r => (r.sides && r.sides.length) ? r.sides : (r.sides_auto || []);
const present = new Set(ROUTES.flatMap(routeSides));
const sideList = CANON.filter(s => present.has(s));
if (ROUTES.some(r => !routeSides(r).length)) sideList.push('— unspecified');
const SIDE_HUE = new Map(ORDER.map((s, i) => [s, PALETTE[i % PALETTE.length]]));
const sideColor = new Map(sideList.map(s => [s, SIDE_HUE.get(s.replace('Дальний ', '')) || '#9aa1a9']));
function distColor(km) {
  if (km < 60) return '#1fa363';
  if (km < 120) return '#2b7fe8';
  if (km < 200) return '#e0a800';
  if (km < 350) return '#e8522b';
  return '#b455d6';
}
function routeColor(route) {
  const mode = colorBySel.value;
  if (mode === 'none') return '#e8522b';
  if (mode === 'side') return sideColor.get(routeSides(route)[0]) || '#9aa1a9';
  if (mode === 'dist') return distColor(route.geo_km || parseFloat(route.dist) || 0);
  if (mode === 'year') {
    const y = parseInt((route.date || '').slice(0, 4), 10);
    return isNaN(y) ? '#9aa1a9' : PALETTE[(y - 2010 + PALETTE.length * 2) % PALETTE.length];
  }
  return '#e8522b';
}
/* ---------- map ---------- */
const coarsePointer = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
const trackRenderer = L.canvas({ tolerance: coarsePointer ? 16 : 5 });
const map = L.map('tv-map', {
  preferCanvas: true, renderer: trackRenderer, center: [55.75, 37.62], zoom: 8,
});
const base = {
  'OSM': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom: 19, attribution: '© OpenStreetMap' }),
  'OpenTopoMap': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
    { maxZoom: 17, attribution: '© OpenTopoMap, © OpenStreetMap' }),
  'Satellite (Esri)': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 18, attribution: 'Esri' }),
};
base['OSM'].addTo(map);
const trackLayer = L.layerGroup().addTo(map);
/* Own rides share the canvas with the routes: a separate pane on top would
   swallow every click meant for the layer underneath. */
// One multi-segment polyline holding only what the current view needs: a
// thousand separate layers, or all of them at once, freeze the page for a second.
const mineLayer = L.polyline([], { color: '#1f2329', weight: 4, opacity: 0.75 });
mineLayer.on('click', (e) => {
  lastTrackClick = Date.now();
  const t = nearestMine(e.latlng);
  if (t) showMineDetail(t);
});
function nearestMine(latlng) {
  const pad = 0.02;
  let best = null, bestDistance = Infinity;
  for (const t of MINE) {
    if (latlng.lat < t.bbox[0] - pad || latlng.lat > t.bbox[2] + pad ||
        latlng.lng < t.bbox[1] - pad || latlng.lng > t.bbox[3] + pad) continue;
    const points = t._hi || (t._hi = decodePolyline(t.poly));
    for (const p of points) {
      const d = (p[0] - latlng.lat) ** 2 + ((p[1] - latlng.lng) * 0.57) ** 2;
      if (d < bestDistance) { bestDistance = d; best = t; }

function latticeStep() {

function gridForView() {

      longitude: missing.map(c => c.lon).join(','),
      hourly: WEATHER_FIELDS.join(','),

      timezone: 'auto',
      wind_speed_unit: 'kmh',

      setWeatherStatus('the weather service asked to slow down, waiting a minute');
      setTimeout(() => { coolingDown = false; setWeatherStatus(''); }, 60000);
      return;
    }
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const payload = await resp.json();
    const list = Array.isArray(payload) ? payload : [payload];
    missing.forEach((cell, i) => {

    .map(c => Object.assign({}, c, { hourly: cellCache.get(`${c.lat},${c.lon}`) }))

      map.fitBounds([[box[0], box[1]], [box[2], box[3]]], { padding: [30, 30] });
    };
  });
}
function paintWind(route) {
  if (!windShown || !weather || !route || !route.tracks) return false;
  highlightLayer.clearLayers();
  for (const tid of route.tracks) {
    const track = trackById.get(tid);
    if (!track) continue;
    const points = routeReversed ? latlngs(track, 'hi').slice().reverse() : latlngs(track, 'hi');
    const step = Math.max(1, Math.floor(points.length / 120));
    for (let i = 0; i + step < points.length; i += step) {
      const a = points[i], b = points[i + step];
      const color = windSegmentColor(bearing(a, b), windAt(a[0], a[1]));
      L.polyline([a, b], {
        color, weight: 6, opacity: 0.95, pane: 'highlightPane', renderer: highlightRenderer,
      }).addTo(highlightLayer);
    }
  }
  return true;
}
/* ---------- panel ---------- */
const weatherPanel = L.DomUtil.create('div', 'tv-weather');
weatherPanel.innerHTML = `
  <div class="tv-weather-row">
    <select id="tv-wday"></select>
    <input type="range" id="tv-whour" min="0" max="23" value="9">
    <span id="tv-wtime">--</span>
  </div>
  <div class="tv-weather-row">
    <label><input type="checkbox" data-field="temp"> temp</label>
    <label><input type="checkbox" data-field="rain"> rain</label>
    <label><input type="checkbox" data-field="soil"> wet</label>
    <label><input type="checkbox" id="tv-wwind"> wind</label>
  </div>
  <div class="tv-weather-row">
    <label><input type="checkbox" id="tv-wbest"> best by wind</label>
    <input type="range" id="tv-wtop" min="3" max="15" value="5">
    <label><input type="checkbox" id="tv-wauto" checked> either way</label>
  </div>
  <ol class="tv-weather-list" id="tv-wlist" style="display:none"></ol>
  <div class="tv-weather-legend" id="tv-wlegend"></div>
  <div class="tv-weather-status" id="tv-wstatus"></div>`;
L.DomEvent.disableClickPropagation(weatherPanel);
L.DomEvent.disableScrollPropagation(weatherPanel);
const WeatherToggle = L.Control.extend({
  onAdd: function () {
    const box = L.DomUtil.create('div', 'tv-weather-box');
    const link = L.DomUtil.create('a', 'tv-panel-toggle', box);
    link.href = '#';
    link.textContent = '☁';
    link.title = 'Weather';
    L.DomEvent.on(link, 'click', L.DomEvent.stop);
    L.DomEvent.on(link, 'click', () => toggleWeather(!weatherPanel.classList.contains('on')));
    box.appendChild(weatherPanel);
    return box;
  },
});
new WeatherToggle({ position: 'topleft' }).addTo(map);
function setWeatherStatus(text) {
  const el = document.getElementById('tv-wstatus');
  if (el) el.textContent = text;
}
function fillDayPicker() {
  const select = document.getElementById('tv-wday');
  if (!weather || select.options.length) return;
  const days = [...new Set(weather.times.map(t => t.slice(0, 10)))];
  select.innerHTML = days.map((d, i) => {
    const label = new Date(d).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
    return `<option value="${d}">${i === 0 ? 'today' : label}</option>`;
  }).join('');
  syncHour();
}
function syncHour() {
  if (!weather) return;
  const day = document.getElementById('tv-wday').value;
  const hour = +document.getElementById('tv-whour').value;
  const stamp = `${day}T${String(hour).padStart(2, '0')}:00`;
  const index = weather.times.indexOf(stamp);
  weatherHour = index < 0 ? 0 : index;
  document.getElementById('tv-wtime').textContent = `${String(hour).padStart(2, '0')}:00`;
  drawWeather();
  positionSheets();
  rankByWind();
  if (selected !== null && windShown) paintWind(ROUTES[selected]);
}
function updateLegend() {
  const el = document.getElementById('tv-wlegend');
  if (!el) return;
  const scales = {
    temp: 'degrees at 2 m',
    rain: 'millimetres in that hour',
    soil: 'water in the top 7 cm of soil, per cent by volume: bigger means muddier',
  };
  const wind = windShown
    ? '<span class="tv-weather-note">arrows show where the wind blows to, the numbers are km/h: '
      + 'steady…gusts, and the colour follows the gusts. '
      + 'A picked route is painted <i style="background:#1fa363"></i> with the wind, '
      + '<i style="background:#c0392b"></i> against it.</span>'
    : '';
  const note = Object.keys(shownFields).filter(f => shownFields[f])
    .map(f => `<span class="tv-weather-note">${ICONS[f]} ${scales[f]}</span>`).join('');
  el.innerHTML = note + wind;
}
/* Hiding the panel must not switch the weather off: on a phone the panel covers
   the map, so it gets folded away constantly while the layers should stay. */
function hideWeatherPanel() {
  weatherPanel.classList.remove('on');
  positionSheets();
}
async function toggleWeather(on) {
  weatherPanel.classList.toggle('on', on);
  if (!on) return;
  if (NARROW()) {
    detailEl.classList.add('tv-min');   // fold the track card out of the way
    const min = document.getElementById('tv-detailMin');
    if (min) min.textContent = '▴';
    positionSheets();
  }
  if (!map.hasLayer(weatherLayer)) {
    map.addLayer(weatherLayer);
    map.addLayer(windLayer);
  }
  try {
    await loadWeather();
  } catch (err) {
    setWeatherStatus('weather is unavailable: ' + (err.message || err));
    return;
  }
  syncHour();
}
document.getElementById('tv-wday').onchange = syncHour;
document.getElementById('tv-whour').oninput = syncHour;
document.getElementById('tv-wwind').onchange = e => {
  windShown = e.target.checked;
  drawWeather();
  if (selected !== null) {
    if (windShown) paintWind(ROUTES[selected]);
    else selectRoute(selected);
  }
};
weatherPanel.querySelectorAll('input[data-field]').forEach(el => {
  el.onchange = () => { shownFields[el.dataset.field] = el.checked; drawWeather(); };
});
['tv-wbest', 'tv-wauto', 'tv-wtop'].forEach(id => {
  const el = document.getElementById(id);
  el.oninput = rankByWind;
  el.onchange = rankByWind;
});
map.on('moveend', () => {
  if (!weatherPanel.classList.contains('on')) return;
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => {
    loadWeather().then(syncHour).catch(err => setWeatherStatus(String(err.message || err)));
  }, REFRESH_DELAY);
});
};
</script>

<script>
/* Downloads the encrypted file, asks for a password, decrypts in the browser.
   Layout: 'VELO1' | iterations (uint32 BE) | salt (16) | iv (12) | AES-256-GCM. */
(function () {
  var DATA_URL = "https://dl.dropboxusercontent.com/scl/fi/pe820odg4jkjgfxyk3x72/velo.enc?rlkey=fqy6oj6yl6ggddcumhmhdab4z";
  var STORE_KEY = "track-vault-key";
  var gate = document.getElementById('tv-gate');
  var status = document.getElementById('tv-gateStatus');
  var form = document.getElementById('tv-gateForm');
  var cache = null;
  function showForm(visible) {
    form.style.display = visible ? '' : 'none';
  }
  function setBusy(busy) {
    [...form.elements].forEach(function (el) { el.disabled = busy; });
  }
  function say(text, isError) {
    status.textContent = text;
    status.className = isError ? 'status err' : 'status';
  }
  async function download() {
    if (cache) return cache;
    say('downloading…');
    var resp = await fetch(DATA_URL);
    if (!resp.ok) throw new Error('download failed: HTTP ' + resp.status);
    var total = +resp.headers.get('content-length') || 0;
    var reader = resp.body.getReader();
    var chunks = [], got = 0, chunk;
    while (!(chunk = await reader.read()).done) {
      chunks.push(chunk.value);
      got += chunk.value.length;
      say(total ? 'downloading… ' + Math.round(got / total * 100) + '%'
                : 'downloading… ' + Math.round(got / 1e6) + ' MB');
    }
    var blob = new Uint8Array(got), at = 0;
    chunks.forEach(function (c) { blob.set(c, at); at += c.length; });
    cache = blob;
    return blob;
  }
  async function unpack(blob, keyBytes, password) {
    if (new TextDecoder().decode(blob.slice(0, 5)) !== 'VELO1') throw new Error('unexpected file');
    var iters = new DataView(blob.buffer, blob.byteOffset + 5, 4).getUint32(0);
    var salt = blob.slice(9, 25), iv = blob.slice(25, 37), cipher = blob.slice(37);
    if (!keyBytes) {
      say('checking the password…');
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password),
                                               'PBKDF2', false, ['deriveBits']);
      keyBytes = new Uint8Array(await crypto.subtle.deriveBits(
        {name: 'PBKDF2', salt: salt, iterations: iters, hash: 'SHA-256'}, base, 256));
    }
    var key = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
    say('decrypting…');
    var packed = await crypto.subtle.decrypt({name: 'AES-GCM', iv: iv}, key, cipher);
    var stream = new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'));
    return {text: await new Response(stream).text(), keyBytes: keyBytes};
  }
  async function open(password, keyBytes, remember) {
    var res = await unpack(await download(), keyBytes, password);
    if (remember) {
      localStorage.setItem(STORE_KEY, btoa(String.fromCharCode.apply(null, res.keyBytes)));
    }
    window.VELO_DATA = JSON.parse(res.text);
    gate.remove();
    window.__bootMap();
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = document.getElementById('tv-pw').value;
    if (!pw) return;
    setBusy(true);
    open(pw, null, document.getElementById('tv-remember').checked).catch(function (err) {
      setBusy(false);
      var wrongPassword = err.name === 'OperationError' || /decrypt/i.test(String(err.message || err));
      say(wrongPassword ? 'wrong password' : 'error: ' + (err.message || err), true);
    });
  });
  var saved = localStorage.getItem(STORE_KEY);
  if (saved) {
    // the key is already here: asking for a password while downloading only confuses
    showForm(false);
    var bytes = Uint8Array.from(atob(saved), function (c) { return c.charCodeAt(0); });
    open(null, bytes, false).catch(function () {
      localStorage.removeItem(STORE_KEY);
      showForm(true);
      document.getElementById('tv-pw').focus();
      say('the saved key no longer works, enter the password', true);
    });
  } else {
    document.getElementById('tv-pw').focus();
  }
})();
</script>
