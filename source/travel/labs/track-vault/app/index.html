<style>
/* Everything is scoped to #tv: the page may be embedded into someone else layout. */
#tv {
  --tv-bg: #ffffff; --tv-fg: #1b1d21; --tv-muted: #6b7280; --tv-line: #e3e6ea;
  --tv-accent: #e8522b; --tv-side: 380px;
  position: relative; display: flex; overflow: hidden;
  height: 82vh; min-height: 460px;
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--tv-fg); background: var(--tv-bg);
  border: 1px solid var(--tv-line); border-radius: 10px;
}
/* Embedded map breaks out of a narrow column and spans the window.
   40px are left over so a scrollbar cannot cause horizontal scrolling. */
#tv:not(.tv-full) {
  --tv-wide: min(1400px, calc(100vw - 40px));
  width: var(--tv-wide);
  max-width: none;
  margin-left: calc(50% - var(--tv-wide) / 2);
}
#tv.tv-full { height: 100vh; min-height: 0; border: none; border-radius: 0; }
/* expanded map: covers the whole window on top of the page */
#tv.tv-cover {
  position: fixed; inset: 0; z-index: 99999;
  width: auto; height: auto; margin: 0; min-height: 0;
  border: none; border-radius: 0;
}
#tv:fullscreen, #tv:-webkit-full-screen {
  width: 100vw; height: 100vh; margin-left: 0; min-height: 0;
  border: none; border-radius: 0; background: var(--tv-bg);
}
#tv *, #tv *::before, #tv *::after { box-sizing: border-box; }
#tv-sidebar {
  width: var(--tv-side); min-width: var(--tv-side); height: 100%;
  display: flex; flex-direction: column; border-right: 1px solid var(--tv-line);
}
#tv-map { flex: 1; height: 100%; }
#tv.tv-collapsed #tv-sidebar { display: none; }
/* the button lives among the leaflet controls, under the zoom buttons */
#tv .tv-panel-toggle {
  display: block; width: 30px; height: 30px; line-height: 30px; text-align: center;
  background: #fff; color: #1b1d21; font-size: 16px; text-decoration: none;
  border: 2px solid rgba(0,0,0,.2); border-radius: 4px; background-clip: padding-box;
}
#tv .tv-panel-toggle:hover { background: #f4f4f4; }
#tv header { padding: 10px 12px 8px; border-bottom: 1px solid var(--tv-line); }
#tv h1 { font-size: 15px; margin: 0 0 2px; }
#tv .sub { color: var(--tv-muted); font-size: 12px; }
#tv .controls { padding: 8px 12px; border-bottom: 1px solid var(--tv-line); }
#tv .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
#tv input[type=text], #tv input[type=number], #tv select {

#tv input[type=text] { flex: 1; }
#tv input[type=number] { width: 68px; }
#tv label.lbl { color: var(--tv-muted); font-size: 12px; white-space: nowrap; }
#tv .chips {
  display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px;

}
#tv .chips.tv-hidden { display: none; }
#tv button.on { background: var(--tv-accent); border-color: var(--tv-accent); color: #fff; }
#tv .chip {
  font-size: 11px; padding: 3px 7px; border-radius: 11px; cursor: pointer;
  border: 1px solid var(--tv-line); background: #f7f8fa; user-select: none;
}
#tv .chip.on { background: var(--tv-accent); border-color: var(--tv-accent); color: #fff; }
#tv .chip .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; }
#tv button {
  font: inherit; font-size: 12px; padding: 5px 9px; border: 1px solid var(--tv-line);
  background: #f7f8fa; border-radius: 6px; cursor: pointer; color: inherit;
}
#tv button:hover { background: #eef0f3; }
#tv .tabs { display: flex; gap: 4px; padding: 8px 12px 0; }
#tv .tab { font-size: 12px; padding: 5px 9px; border-radius: 6px 6px 0 0; cursor: pointer; color: var(--tv-muted); }
#tv .tab.on {

}
#tv-list { flex: 1; overflow-y: auto; border-top: 1px solid var(--tv-line); }
#tv .item { padding: 7px 12px; border-bottom: 1px solid #f0f2f4; cursor: pointer; }
#tv .item:hover { background: #f7f8fa; }
#tv .item.sel { background: #fdece7; }
#tv .item .t { font-weight: 500; }
#tv .item .m { color: var(--tv-muted); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
#tv .swatch { width: 3px; border-radius: 2px; background: #999; align-self: stretch; }
#tv .item-inner { display: flex; gap: 8px; }
#tv-more { padding: 10px; text-align: center; }
#tv-detail {
  position: absolute; right: 12px; top: 12px; width: 340px; max-height: calc(100% - 24px);
  overflow-y: auto; background: #fff; border: 1px solid var(--tv-line); border-radius: 10px;
  box-shadow: 0 6px 24px rgba(0,0,0,.14); padding: 12px 14px; z-index: 1000; display: none;
}
#tv-detail h2 { font-size: 15px; margin: 0 8px 4px 0; }
#tv-detail .close {

}
#tv-detail .desc { white-space: pre-wrap; margin: 8px 0; max-height: 220px; overflow-y: auto; font-size: 13px; }
#tv-detail a { color: var(--tv-accent); }
#tv .kv { color: var(--tv-muted); font-size: 12px; }
#tv .links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
#tv .links a { text-decoration: none; border: 1px solid var(--tv-line); padding: 4px 8px; border-radius: 6px; }
#tv .hint { color: var(--tv-muted); font-size: 12px; padding: 10px 12px; }
/* weather panel */
#tv .tv-weather-box { position: relative; }
#tv .tv-weather {
  display: none; position: absolute; left: 38px; top: 0; width: 250px;
  background: #fff; border: 1px solid var(--tv-line); border-radius: 8px;
  padding: 8px 10px; box-shadow: 0 6px 20px rgba(0,0,0,.15); font-size: 12px;
}
#tv .tv-weather.on { display: block; }
#tv .tv-weather-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
#tv .tv-weather-row label { display: flex; align-items: center; gap: 3px; color: var(--tv-muted); }
#tv .tv-weather select { font: inherit; font-size: 12px; padding: 3px 5px; border: 1px solid var(--tv-line); border-radius: 5px; }
#tv .tv-weather input[type=range] { flex: 1; min-width: 90px; }
#tv .tv-weather-legend { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; color: var(--tv-muted); }
#tv .tv-weather-legend i { display: inline-block; width: 14px; height: 10px; border-radius: 2px; margin-right: 2px; }
#tv .tv-weather-note { display: block; margin-top: 4px; line-height: 1.3; }
#tv .tv-weather-status { color: var(--tv-muted); min-height: 14px; margin-top: 4px; }
#tv .tv-value {
  font-size: 13px; font-weight: 700; line-height: 1; white-space: nowrap;
  color: #14181d; text-align: center;
  text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 4px #fff, 0 0 4px #fff;
}
#tv .tv-wind { display: flex; align-items: center; gap: 2px; font-size: 15px; line-height: 1; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
#tv .tv-wind span { display: inline-block; }
#tv .tv-wind b { font-size: 10px; color: #333; font-weight: 600; }
/* password form */
#tv-gate {
  position: absolute; inset: 0; z-index: 5000; display: flex;
  align-items: center; justify-content: center; background: #f4f5f7;
}
#tv-gate .box {
  background: #fff; border: 1px solid var(--tv-line); border-radius: 12px;
  padding: 22px 24px; width: 320px; max-width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,.12);
}
#tv-gate h2 { font-size: 16px; margin: 0 0 4px; }
#tv-gate p { color: var(--tv-muted); font-size: 12px; margin: 0 0 14px; }
#tv-gate input[type=password] {
  width: 100%; font: inherit; font-size: 15px; padding: 8px 10px;
  border: 1px solid var(--tv-line); border-radius: 6px;
}
#tv-gate .row2 { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--tv-muted); }
#tv-gate button { width: 100%; margin-top: 12px; padding: 8px; font-size: 14px; }
#tv-gate .status { margin-top: 10px; font-size: 12px; color: var(--tv-muted); min-height: 16px; }
#tv-gate .status.err { color: #c0392b; }
@media (max-width: 720px) {
  #tv { flex-direction: column; }
  #tv-sidebar {
    width: 100%; min-width: 0; height: 50%;
    border-right: none; border-bottom: 1px solid var(--tv-line);
  }
  #tv-map { height: 50%; }
  #tv-detail { width: auto; left: 12px; }
}

<script>
window.__bootMap = function () {
const D = window.VELO_DATA;
const TRACKS = D.tracks, ROUTES = D.routes, ORPHANS = D.orphans;
const MINE = D.mine || [];   // the athlete's own rides, a backdrop layer
const trackById = new Map(TRACKS.map(t => [t.id, t]));
/* ---------- polyline codec ---------- */
function decodePolyline(str) {
  let index = 0, lat = 0, lng = 0;
  const out = [];
  while (index < str.length) {
    let shift = 0, result = 0, b;
    do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lat += (result & 1) ? ~(result >> 1) : (result >> 1);
    shift = 0; result = 0;
    do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lng += (result & 1) ? ~(result >> 1) : (result >> 1);
    out.push([lat / 1e5, lng / 1e5]);
  }
  return out;
}
function latlngs(track, lod) {
  const key = lod === 'lo' ? '_lo' : '_hi';
  if (!track[key]) track[key] = decodePolyline(lod === 'lo' ? (track.polylo || track.poly) : track.poly);
  return track[key];
}
/* ---------- colors ---------- */
const PALETTE = ['#e8522b','#2b7fe8','#1fa363','#b455d6','#e0a800','#0fb4c4','#d6336c','#7a5cf0',
                 '#5c8a2b','#c2571d','#3d6bb3','#8c8c00','#00897b','#6d4c41','#546e7a'];
// side names come from the sheet as they are written there
const ORDER = ['Центр','Север','Северо-Восток','Восток','Юго-Восток','Юг','Юго-Запад','Запад','Северо-Запад'];
const CANON = ORDER.concat(ORDER.map(s => 'Дальний ' + s));
const routeSides = r => (r.sides && r.sides.length) ? r.sides : (r.sides_auto || []);
const present = new Set(ROUTES.flatMap(routeSides));
const sideList = CANON.filter(s => present.has(s));
if (ROUTES.some(r => !routeSides(r).length)) sideList.push('— unspecified');
const SIDE_HUE = new Map(ORDER.map((s, i) => [s, PALETTE[i % PALETTE.length]]));
const sideColor = new Map(sideList.map(s => [s, SIDE_HUE.get(s.replace('Дальний ', '')) || '#9aa1a9']));
function distColor(km) {
  if (km < 60) return '#1fa363';
  if (km < 120) return '#2b7fe8';
  if (km < 200) return '#e0a800';
  if (km < 350) return '#e8522b';
  return '#b455d6';
}
function routeColor(route) {
  const mode = colorBySel.value;
  if (mode === 'none') return '#e8522b';
  if (mode === 'side') return sideColor.get(routeSides(route)[0]) || '#9aa1a9';
  if (mode === 'dist') return distColor(route.geo_km || parseFloat(route.dist) || 0);
  if (mode === 'year') {
    const y = parseInt((route.date || '').slice(0, 4), 10);
    return isNaN(y) ? '#9aa1a9' : PALETTE[(y - 2010 + PALETTE.length * 2) % PALETTE.length];
  }
  return '#e8522b';
}
/* ---------- map ---------- */
const coarsePointer = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
const trackRenderer = L.canvas({ tolerance: coarsePointer ? 16 : 5 });
const map = L.map('tv-map', {
  preferCanvas: true, renderer: trackRenderer, center: [55.75, 37.62], zoom: 8,
});
const base = {
  'OSM': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom: 19, attribution: '© OpenStreetMap' }),
  'OpenTopoMap': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
    { maxZoom: 17, attribution: '© OpenTopoMap, © OpenStreetMap' }),
  'Satellite (Esri)': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 18, attribution: 'Esri' }),
};
base['OSM'].addTo(map);
const trackLayer = L.layerGroup().addTo(map);
/* Own rides share the canvas with the routes: a separate pane on top would
   swallow every click meant for the layer underneath. */
// One multi-segment polyline holding only what the current view needs: a
// thousand separate layers, or all of them at once, freeze the page for a second.
const mineLayer = L.polyline([], { color: '#1f2329', weight: 4, opacity: 0.75 });
mineLayer.on('click', (e) => {
  lastTrackClick = Date.now();
  const t = nearestMine(e.latlng);
  if (t) showMineDetail(t);
});
function nearestMine(latlng) {
  const pad = 0.02;
  let best = null, bestDistance = Infinity;
  for (const t of MINE) {
    if (latlng.lat < t.bbox[0] - pad || latlng.lat > t.bbox[2] + pad ||
        latlng.lng < t.bbox[1] - pad || latlng.lng > t.bbox[3] + pad) continue;
    const points = t._hi || (t._hi = decodePolyline(t.poly));
    for (const p of points) {
      const d = (p[0] - latlng.lat) ** 2 + ((p[1] - latlng.lng) * 0.57) ** 2;
      if (d < bestDistance) { bestDistance = d; best = t; }
    }
  }
  return best;
}
function showMineDetail(t) {
  highlightLayer.clearLayers();
  L.polyline(t._hi || decodePolyline(t.poly), {
    color: '#fff23a', weight: 4, opacity: 1, pane: 'highlightPane', renderer: highlightRenderer,
  }).addTo(highlightLayer);
  const stravaId = String(t.id).split('-')[0];
  detailBody.innerHTML = `<h2>${esc(t.name) || 'Ride'}</h2>
    <div class="kv">${esc(t.date)} · ${esc(t.type)} · ${t.km} km</div>
    <div class="kv">my own ride</div>
    <div class="links">
      <a href="https://www.strava.com/activities/${esc(stravaId)}" target="_blank" rel="noopener">Strava ↗</a>
    </div>`;
  detailEl.style.display = 'block';
}
function refreshMine() {
  if (!map.hasLayer(mineLayer)) return;
  const b = map.getBounds(), lod = map.getZoom() >= 11 ? '_hi' : '_lo';
  const segments = [];
  for (const t of MINE) {
    if (t.bbox[0] > b.getNorth() || t.bbox[2] < b.getSouth() ||
        t.bbox[1] > b.getEast() || t.bbox[3] < b.getWest()) continue;
    if (!t[lod]) t[lod] = decodePolyline(lod === '_lo' ? (t.polylo || t.poly) : t.poly);
    segments.push(t[lod]);
  }
  mineLayer.setLatLngs(segments);
  mineLayer.bringToFront();
}
mineLayer.on('add', refreshMine);
const overlays = { [`Saved routes (${ROUTES.length})`]: trackLayer };
if (MINE.length) overlays[`My rides (${MINE.length})`] = mineLayer;
L.control.layers(base, overlays).addTo(map);
L.control.scale({ imperial: false }).addTo(map);
map.createPane('highlightPane');
map.getPane('highlightPane').style.zIndex = 640;
map.getPane('highlightPane').style.pointerEvents = 'none';
const highlightRenderer = L.canvas({ pane: 'highlightPane' });
const extraLayer = L.layerGroup();
const highlightLayer = L.layerGroup().addTo(map);
const drawn = new Map();      // trackId -> {layer, lod}
/* ---------- the sidebar folds away, the map stays ---------- */
const shell = document.getElementById('tv');
let sidebarOpen = false;   // always starts collapsed: the map is the point
let panelButton = null;
function applySidebar() {
  shell.classList.toggle('tv-collapsed', !sidebarOpen);
  if (panelButton) {
    panelButton.textContent = sidebarOpen ? '×' : '☰';
    panelButton.title = sidebarOpen ? 'Hide the list' : 'Show the list';
  }
  setTimeout(() => { map.invalidateSize(); redraw(true); }, 60);
}
const PanelToggle = L.Control.extend({
  onAdd: function () {
    const link = L.DomUtil.create('a', 'tv-panel-toggle');
    link.href = '#';
    L.DomEvent.on(link, 'click', L.DomEvent.stop);
    L.DomEvent.on(link, 'click', () => {
      sidebarOpen = !sidebarOpen;
      applySidebar();
    });
    panelButton = link;
    return link;
  },
});
new PanelToggle({ position: 'topleft' }).addTo(map);
/* ---------- state ---------- */
const q = document.getElementById('tv-q');
const dmin = document.getElementById('tv-dmin'), dmax = document.getElementById('tv-dmax');
const ymin = document.getElementById('tv-ymin'), ymax = document.getElementById('tv-ymax');
const colorBySel = document.getElementById('tv-colorBy');
const listEl = document.getElementById('tv-list');
const countsEl = document.getElementById('tv-counts');
const detailEl = document.getElementById('tv-detail'), detailBody = document.getElementById('tv-detailBody');
let activeSides = new Set();
let onlyViewport = false;
let filtered = [];
let selected = null;
let tab = 'routes';
function routeText(r) {
  return ((r.place || '') + ' ' + (r.owner || '') + ' ' + (r.desc || '') + ' ' + (r.side || '')).toLowerCase();
}
ROUTES.forEach(r => { r._text = routeText(r) + ' ' + (r.sides_auto || []).join(' ').toLowerCase(); r._km = r.geo_km || parseFloat((r.dist || '').replace(',', '.')) || 0;
                      r._year = parseInt((r.date || '').slice(0, 4), 10) || 0; });
ORPHANS.forEach(o => { o._text = routeText(o); o._km = parseFloat((o.dist || '').replace(',', '.')) || 0;
                       o._year = parseInt((o.date || '').slice(0, 4), 10) || 0; });
function passes(r, useViewport) {
  const text = q.value.trim().toLowerCase();
  if (text && !text.split(/\s+/).every(w => r._text.includes(w))) return false;
  if (activeSides.size) {
    const rs = routeSides(r).length ? routeSides(r) : ['— unspecified'];
    if (!rs.some(s => activeSides.has(s))) return false;
  }
  const lo = parseFloat(dmin.value), hi = parseFloat(dmax.value);
  if (!isNaN(lo) && r._km < lo) return false;
  if (!isNaN(hi) && r._km > hi) return false;
  const y1 = parseInt(ymin.value, 10), y2 = parseInt(ymax.value, 10);
  if (!isNaN(y1) && (!r._year || r._year < y1)) return false;
  if (!isNaN(y2) && (!r._year || r._year > y2)) return false;
  if (useViewport && r.bbox) {
    const b = map.getBounds();
    if (r.bbox[0] > b.getNorth() || r.bbox[2] < b.getSouth() ||
        r.bbox[1] > b.getEast() || r.bbox[3] < b.getWest()) return false;
  }
  return true;
}
function applyFilters() {
  filtered = ROUTES.filter(r => passes(r, onlyViewport));
  const km = filtered.reduce((s, r) => s + r._km, 0);
  countsEl.textContent = `${filtered.length} of ${ROUTES.length} tracks · ${Math.round(km).toLocaleString('en-US')} km · ${ORPHANS.length} without a map`;
  countsEl.title = `${TRACKS.length} geometries, ${EXTRA.length} unmatched`;
  renderList();
  redraw(true);
}
/* ---------- drawing ---------- */
function redraw(force) {
  const b = map.getBounds(), lod = map.getZoom() >= 11 ? 'hi' : 'lo';
  const want = new Map();   // trackId -> route (for color)
  for (const r of filtered) {
    for (const tid of r.tracks) {
      const t = trackById.get(tid);
      if (!t) continue;
      if (t.bbox[0] > b.getNorth() || t.bbox[2] < b.getSouth() ||
          t.bbox[1] > b.getEast() || t.bbox[3] < b.getWest()) continue;
      if (!want.has(tid)) want.set(tid, r);

(function () {
  var DATA_URL = "https://dl.dropboxusercontent.com/scl/fi/pe820odg4jkjgfxyk3x72/velo.enc?rlkey=fqy6oj6yl6ggddcumhmhdab4z";
  var STORE_KEY = "track-vault-key";
  var gate = document.getElementById('tv-gate');
  var status = document.getElementById('tv-gateStatus');
  var form = document.getElementById('tv-gateForm');
  var cache = null;
  function showForm(visible) {
    form.style.display = visible ? '' : 'none';
  }
  function setBusy(busy) {
    [...form.elements].forEach(function (el) { el.disabled = busy; });
  }
  function say(text, isError) {
    status.textContent = text;
    status.className = isError ? 'status err' : 'status';
  }
  async function download() {
    if (cache) return cache;
    say('downloading…');
    var resp = await fetch(DATA_URL);
    if (!resp.ok) throw new Error('download failed: HTTP ' + resp.status);
    var total = +resp.headers.get('content-length') || 0;
    var reader = resp.body.getReader();
    var chunks = [], got = 0, chunk;
    while (!(chunk = await reader.read()).done) {
      chunks.push(chunk.value);
      got += chunk.value.length;
      say(total ? 'downloading… ' + Math.round(got / total * 100) + '%'
                : 'downloading… ' + Math.round(got / 1e6) + ' MB');
    }
    var blob = new Uint8Array(got), at = 0;
    chunks.forEach(function (c) { blob.set(c, at); at += c.length; });
    cache = blob;
    return blob;
  }
  async function unpack(blob, keyBytes, password) {
    if (new TextDecoder().decode(blob.slice(0, 5)) !== 'VELO1') throw new Error('unexpected file');
    var iters = new DataView(blob.buffer, blob.byteOffset + 5, 4).getUint32(0);
    var salt = blob.slice(9, 25), iv = blob.slice(25, 37), cipher = blob.slice(37);
    if (!keyBytes) {
      say('checking the password…');
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password),
                                               'PBKDF2', false, ['deriveBits']);
      keyBytes = new Uint8Array(await crypto.subtle.deriveBits(
        {name: 'PBKDF2', salt: salt, iterations: iters, hash: 'SHA-256'}, base, 256));
    }
    var key = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
    say('decrypting…');
    var packed = await crypto.subtle.decrypt({name: 'AES-GCM', iv: iv}, key, cipher);
    var stream = new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'));
    return {text: await new Response(stream).text(), keyBytes: keyBytes};
  }
  async function open(password, keyBytes, remember) {
    var res = await unpack(await download(), keyBytes, password);
    if (remember) {
      localStorage.setItem(STORE_KEY, btoa(String.fromCharCode.apply(null, res.keyBytes)));
    }
    window.VELO_DATA = JSON.parse(res.text);
    gate.remove();
    window.__bootMap();
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = document.getElementById('tv-pw').value;
    if (!pw) return;
    setBusy(true);
    open(pw, null, document.getElementById('tv-remember').checked).catch(function (err) {
      setBusy(false);
      var wrongPassword = err.name === 'OperationError' || /decrypt/i.test(String(err.message || err));
      say(wrongPassword ? 'wrong password' : 'error: ' + (err.message || err), true);
    });
  });
  var saved = localStorage.getItem(STORE_KEY);
  if (saved) {
    // the key is already here: asking for a password while downloading only confuses
    showForm(false);
    var bytes = Uint8Array.from(atob(saved), function (c) { return c.charCodeAt(0); });
    open(null, bytes, false).catch(function () {
      localStorage.removeItem(STORE_KEY);
      showForm(true);
      document.getElementById('tv-pw').focus();
      say('the saved key no longer works, enter the password', true);
    });
  } else {
    document.getElementById('tv-pw').focus();
  }
})();
</script>
